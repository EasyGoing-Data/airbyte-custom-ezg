documentationUrl: https://developers.facebook.com/docs/audience-network/optimization/report-api/guide-v2
connectionSpecification:
  $schema: http://json-schema.org/draft-07/schema#
  title: Meta Audience Network Reporting Spec
  type: object
  required:
    - accounts
    - start_date
  properties:
    accounts:
      title: Meta Accounts
      description: One entry per Meta business. The access token must be a long-lived USER access token obtained through Facebook Login with the read_audience_network_insights permission; system user tokens and tokens generated in Business Manager / Monetization Manager are rejected by the API.
      order: 0
      type: array
      minItems: 1
      items:
        type: object
        required:
          - account_name
          - business_id
          - access_token
        properties:
          account_name:
            title: Account Name
            description: Identifier stored in the account_name column (e.g. data@easygoing.vn)
            type: string
          business_id:
            title: Business ID
            description: Meta business ID that owns the Audience Network properties (a property ID or app ID also works).
            type: string
          access_token:
            title: Access Token
            description: Long-lived user access token with read_audience_network_insights (sent as "Authorization Bearer", never in the URL).
            type: string
            airbyte_secret: true
    start_date:
      title: Start Date
      description: Start date (Pacific time day) in YYYY-MM-DD format for the first sync / backfill. The API keeps 540 days, earlier dates are clamped.
      order: 1
      type: string
      format: date
    number_days_backward:
      title: Number of days backward (lookback)
      description: Each run goes back this many days from the last cursor to refresh recently-updated data. Default 14.
      order: 2
      type: integer
      default: 14
      minimum: 1
      maximum: 90
    get_last_X_days:
      title: Get last X days only
      description: If true, ignore Start Date and always fetch only the last X days (X = number of days backward).
      order: 3
      type: boolean
      default: false
    window_days:
      title: Days per request
      description: Date-range width of each API request. Synchronous requests are limited to 8 days. Default 7, maximum 7.
      order: 4
      type: integer
      default: 7
      minimum: 1
      maximum: 7
    breakdowns:
      title: Breakdowns
      description: "Grain of stream meta_audience_network_report (besides date). Allowed: placement, placement_name, country, platform, property, delivery_method, ad_space. placement and placement_name cannot be combined. Finer grain means more cells whose revenue Meta withholds for low impressions; stream meta_audience_network_total always has the full daily total."
      order: 5
      type: array
      items:
        type: string
        enum: [placement, placement_name, country, platform, property, delivery_method, ad_space]
      default: [placement, country, platform]
    metrics:
      title: Metrics
      description: "Metrics for both streams. Column names drop the fb_ad_network_ prefix."
      order: 6
      type: array
      items:
        type: string
        enum:
          - fb_ad_network_request
          - fb_ad_network_filled_request
          - fb_ad_network_imp
          - fb_ad_network_click
          - fb_ad_network_revenue
          - fb_ad_network_cpm
          - fb_ad_network_ctr
          - fb_ad_network_fill_rate
          - fb_ad_network_show_rate
          - fb_ad_network_bidding_request
          - fb_ad_network_bidding_response
          - fb_ad_network_bidding_bid_rate
          - fb_ad_network_bidding_win_rate
      default:
        - fb_ad_network_request
        - fb_ad_network_filled_request
        - fb_ad_network_imp
        - fb_ad_network_click
        - fb_ad_network_revenue
    graph_api_version:
      title: Graph API version
      description: Graph API version in the request path. Default v27.0. Raise it when Meta retires the version.
      order: 7
      type: string
      default: v27.0
