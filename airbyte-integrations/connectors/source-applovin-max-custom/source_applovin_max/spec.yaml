documentationUrl: https://docsurl.com
connectionSpecification:
  $schema: http://json-schema.org/draft-07/schema#
  title: Applovin Max User-Level Spec
  type: object
  required:
    - accounts
    - start_date
  properties:
    accounts:
      title: AppLovin Accounts
      description: One entry per AppLovin account. Each account has its own Report Key (Account > Keys).
      order: 0
      type: array
      minItems: 1
      items:
        type: object
        required:
          - account_name
          - api_key
        properties:
          account_name:
            title: Account Name
            description: Identifier stored in the account_name column (e.g. data@easygoing.vn)
            type: string
          api_key:
            title: Report Key
            description: This account's AppLovin Report Key (Account > Keys)
            type: string
            airbyte_secret: true
    start_date:
      title: Start Date
      description: Start date in YYYY-MM-DD format (must be within the last 45 days)
      order: 1
      type: string
      format: date
    number_days_backward:
      title: Number of days backward (lookback)
      description: Each run goes back this many days to refresh recently-updated data. Default 7.
      order: 2
      type: integer
      default: 7
      minimum: 1
      maximum: 45
    get_last_X_days:
      title: Get last X days only
      description: If true, ignore Start Date and always fetch only the last X days (X = number of days backward).
      order: 3
      type: boolean
      default: false
    timezone:
      title: Timezone
      description: Default UTC. Use a tz name like Asia/Ho_Chi_Minh.
      order: 4
      type: string
      default: UTC
